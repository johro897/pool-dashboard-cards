name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pool-dashboard-cards.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
